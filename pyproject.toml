[project]
name = "sha-pipelines"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "openpyxl",
    "pyodbc",
    "sqlalchemy>=2.0",
    "rank-bm25",
    "numpy",
    "langchain-core",
    "langchain-anthropic",
    "langchain-openai",
    "python-dotenv",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "asyncpg",
    "psycopg2-binary",
    "alembic",
    "greenlet",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "email-validator",
    "redis",
    "websockets",
    "sse-starlette",
    "apscheduler",
    "tzdata",
    "PyJWT",
    "argon2-cffi",
]

# The previous [tool.setuptools] block described an older FLAT layout: 17
# top-level modules (config.py, db.py, stage_*.py, flow.py ...) that now live
# under common/ and oneds_master/stages/, plus an observability_sdk package
# that is not in this repo at all. setuptools failed on every one of them, so
# `uv sync` could not build the project and the venv was left empty.
#
# The code is run as modules from the repo root (python -m
# oneds_master.batch_flow) using implicit namespace packages, so there is
# nothing here that needs installing. Declaring no packages keeps the
# dependency list usable via `uv sync` without asking setuptools to build a
# distribution the layout does not support.
[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
