services:
  sha-mapping-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sha-mapping-engine
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8099}:8099"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
